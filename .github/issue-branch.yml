# 기본 기준이 될 브랜치 (dev 브랜치 기반으로 생성)
defaultBranch: dev

# 브랜치 명명 규칙 정의 (${type}/${issue.number}-${slug})
branchName: "${type}/${issue.number}-${title}"

# 이슈 제목에서 [feat], [fix], [chore] 등을 감지하여 type으로 지정
branches:
  - label: "enhancement"
    name: "feat/${issue.number}-${title}"
  - label: "bug"
    name: "fix/${issue.number}-${title}"
  - label: "refactor"
    name: "refactor/${issue.number}-${title}"
  - label: "chore"
    name: "chore/${issue.number}-${title}"
  - label: "documentation"
    name: "docs/${issue.number}-${title}"

# 한글 및 특수문자를 영문 변환 규칙에 맞춰 소문자/하이픈으로 슬러그화
stringTransformations:
  - replace: " "
    with: "-"
  - toLowerCase: true
